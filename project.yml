name: DSHGo
options:
  bundleIdPrefix: com.dshgo
  deploymentTarget:
    iOS: "16.4"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "15.4"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.4"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  DSHGo:
    type: application
    platform: iOS
    deploymentTarget: "16.4"
    sources:
      - path: DSHGo
        excludes:
          - "Resources/Info.plist"
          - "Resources/.gitkeep"
    info:
      path: DSHGo/Resources/Info.plist
      properties:
        CFBundleDisplayName: DSH Go
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: zh-Hans
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Light
        UIStatusBarStyle: UIStatusBarStyleDarkContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: 用于连接你电脑上运行的 dshgo 插件（局域网/Tailscale 地址），访问 DSH 会话。
        NSMicrophoneUsageDescription: 用于语音输入：直接说出你想让 agent 做的事。
        NSSpeechRecognitionUsageDescription: 用于把你说的话转成文字，填进 DSH 的输入框。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # 转发端口是 http://<IP>:3081 这种 IP 字面量，NSAllowsLocalNetworking 覆盖不到
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dshgo.DSHGo
        PRODUCT_NAME: DSHGo
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleDisplayName: DSH Go

schemes:
  DSHGo:
    build:
      targets:
        DSHGo: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
